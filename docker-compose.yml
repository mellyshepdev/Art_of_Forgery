services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge
    restart: unless-stopped
    # Routing lives in Traefik's file provider (dynamic-config/forge.yml), which
    # serves forge.prime-quality.online only. These labels used to publish
    # forge.theofficialblacksheepco.online as a second way in - retired
    # 2026-08-14. Leaving traefik.enable=false so the docker provider cannot
    # quietly re-add a route that bypasses the intended single entrypoint.
    labels:
      - "traefik.enable=false"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true

