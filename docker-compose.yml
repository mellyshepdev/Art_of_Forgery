services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge
    # "no", not unless-stopped, and this is load-bearing. forge is idle-stopped
    # by locator after 15m of no traffic (idle_stop in locator.yml) and brought
    # back by wake-on-request when someone visits. A restart policy fights that:
    # unless-stopped resurrects the container the moment the Docker daemon
    # restarts or the host reboots, so the box would come back up running a
    # service nobody asked for and the idle policy would look broken. Wake is
    # the only thing that should start this container.
    restart: "no"
    # Routing lives in Traefik's file provider (dynamic-config/forge.yml), which
    # serves forge.prime-quality.online -> http://forge:80, and only that. These
    # labels used to publish forge.theofficialblacksheepco.online as a second way
    # in - retired 2026-08-14. traefik.enable=false stays so the docker provider
    # cannot quietly re-add a route that bypasses the single intended entrypoint.
    #
    # Not network_mode: host, which the initial commit used - wrong on unit8,
    # where host :80 is Traefik itself and the server could not bind. Mirrors the
    # locator registry copy at locator/registry_data/compose/forge.yml.
    labels:
      - "traefik.enable=false"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
