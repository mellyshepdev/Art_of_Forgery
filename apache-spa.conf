# Client-side routing for the Vite build. Apache serves real files straight
# from disk and falls everything else back to index.html, so a deep link like
# /card/42 reaches React instead of returning 404.
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # An existing file or directory wins - assets must never hit the fallback.
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # Everything else is a route, not a file.
    RewriteRule ^ index.html [L]
</Directory>
